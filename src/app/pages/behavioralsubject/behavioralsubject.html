<!-- INCRESE -->
 <p>Count: {{ count | async }}</p>

<button (click)="increase()" class="bg-blue-300">Increase</button>



@for (user of (staff | async); track user.id) {
  <p class="mt-3">
    {{ user.name }} - GHS {{ user.salary }}
  </p>
}

<!-- DELETE -->
 @for (user of (staff | async) ?? []; track user.id) {
  <p>
    {{ user.name }} - GHS {{ user.salary }}

    <button (click)="deleteStaff(user.id)" class="mt-3">
      Delete
    </button>
  </p>
}
